[tools]
# Keep development Go identical to the root go.work toolchain.
go = "1.26.8"
node = "24"

[tasks.doctor]
description = "Check the core local development toolchain"
run = '''
go version
node --version
npm --version
git --version
docker --version
if docker compose version >/dev/null 2>&1; then
  docker compose version
else
  docker-compose version
fi
'''

[tasks.dev]
description = "Start the Dev Plane development environment"
run = "make dev"

[tasks.test]
description = "Run the repository test gate"
run = "make test"

[tasks.test-cli]
description = "Run the CLI test suite"
run = "make test-cli"

[tasks.lint]
description = "Run repository linters"
run = "make lint"

[tasks.build]
description = "Build repository artifacts"
run = "make build"
