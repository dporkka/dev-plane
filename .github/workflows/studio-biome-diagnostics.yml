name: Studio Biome Diagnostics

on:
  push:
    branches:
      - test/studio-ci-integration-20261017

permissions:
  contents: read

jobs:
  biome-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build local SDK
        run: |
          cd packages/sdk/typescript
          npm ci
          npm run build
      - name: Install web dependencies
        run: cd apps/web && npm ci
      - name: Show all Biome diagnostics
        run: cd apps/web && npx biome check . --max-diagnostics=200
