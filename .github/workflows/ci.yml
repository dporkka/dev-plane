name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.26.8"
  NODE_VERSION: "24"
  DATABASE_URL: "file:./data/dev.db?_journal_mode=WAL"
  NATS_URL: "nats://localhost:4222"
  JWT_SECRET: "ci-secret-change-me-min-32-chars-long"
  SECRET_ENCRYPTION_KEYS: "primary:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/sdk/typescript/package-lock.json

      - name: Install web dependencies
        run: cd apps/web && npm ci

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          install-only: true

      - name: Go lint and vet
        run: make lint-go

      - name: Web lint
        run: make lint-web

      - name: Web typecheck
        run: cd apps/web && npm run typecheck

      - name: SDK typecheck
        run: make lint-sdk

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/sdk/typescript/package-lock.json

      - name: Install web dependencies
        run: cd apps/web && npm ci

      - name: Start NATS
        run: docker compose up -d --wait nats

      - name: Run Go and SDK tests
        run: make test

      - name: Run web tests
        run: cd apps/web && npm test

  build:
    name: Build and release smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/sdk/typescript/package-lock.json

      - name: Build all
        run: make build

      - name: Smoke unified binary from an empty database
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/dev-plane-smoke.db*
          PORT=18080 \
          DATABASE_URL='file:/tmp/dev-plane-smoke.db?_journal_mode=WAL' \
          NATS_URL='' \
          ./bin/api >/tmp/dev-plane-api.log 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" >/dev/null 2>&1 || true
            wait "$api_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/dev-plane-api.log
            exit 1
          fi

          curl -fsS http://127.0.0.1:18080/ | grep -q '<title>AI Dev Control Plane</title>'

      - name: Build release image
        run: docker build -f infra/docker/api.Dockerfile -t dev-plane-api:ci .

      - name: Smoke release image from an empty database
        shell: bash
        run: |
          set -euo pipefail
          docker run -d \
            --name dev-plane-release-smoke \
            --network host \
            -e PORT=18081 \
            -e DATABASE_URL='file:/app/data/dev.db?_journal_mode=WAL' \
            -e NATS_URL='' \
            -e JWT_SECRET \
            -e SECRET_ENCRYPTION_KEYS \
            dev-plane-api:ci
          cleanup() {
            docker logs dev-plane-release-smoke || true
            docker rm -f dev-plane-release-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            exit 1
          fi

          curl -fsS http://127.0.0.1:18081/ | grep -q '<title>AI Dev Control Plane</title>'
