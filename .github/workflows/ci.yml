name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25.11"
  NODE_VERSION: "24"
  DATABASE_URL: "file:./data/dev.db?_journal_mode=WAL"
  NATS_URL: "nats://localhost:4222"
  JWT_SECRET: "ci-secret-change-me-min-32-chars-long"
  SECRET_ENCRYPTION_KEYS: "primary:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
  NEXT_PUBLIC_API_URL: "http://localhost:8080"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/sdk/typescript/package-lock.json

      - name: Install web dependencies
        run: cd apps/web && npm ci

      - name: Go vet
        run: make lint-go

      - name: Web ESLint
        run: make lint-web

      - name: SDK typecheck
        run: make lint-sdk

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/sdk/typescript/package-lock.json

      - name: Start NATS
        run: docker compose up -d --wait nats

      - name: Run tests
        run: make test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/sdk/typescript/package-lock.json

      - name: Install web dependencies
        run: cd apps/web && npm ci

      - name: Build SDK
        run: make build-sdk

      - name: Build all
        run: make build
