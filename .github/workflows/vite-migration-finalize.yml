name: Finalize Vite migration

on:
  push:
    branches: [codex/vite-tanstack-go-embed]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/vite-tanstack-go-embed
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/sdk/typescript/package-lock.json

      - name: Apply mechanical cutover edits
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('apps/api/cmd/api/main.go')
          text = p.read_text()
          old = 'if err := srv.Start(addr); err != nil && err != http.ErrServerClosed {'
          new = 'if err := srv.StartUnified(addr); err != nil && err != http.ErrServerClosed {'
          if old not in text:
              raise SystemExit('main.go Start call not found')
          p.write_text(text.replace(old, new, 1))

          p = Path('Makefile')
          text = p.read_text()
          old = 'build-api: ## Build API binary --> bin/api'
          new = 'build-api: build-web ## Build unified API + embedded Vite UI --> bin/api'
          if old not in text:
              raise SystemExit('Makefile build-api target not found')
          text = text.replace(old, new, 1)
          text = text.replace('build-web: build-sdk ## Build Next.js for production', 'build-web: build-sdk ## Build Vite frontend for embedding', 1)
          text = text.replace('Building Next.js...', 'Building Vite frontend...', 1)
          text = text.replace('Next.js build complete.', 'Vite build complete.', 1)
          text = text.replace('clean: ## Remove bin/ and .next/ build artifacts', 'clean: ## Remove binaries and generated frontend artifacts', 1)
          text = text.replace('@cd apps/web && rm -rf .next/', '@rm -rf apps/api/internal/webui/dist/web', 1)
          p.write_text(text)

          p = Path('apps/web/app/architecture/page.tsx')
          text = p.read_text().replace('The Web UI (Next.js 16) provides the primary interface.', 'The Web UI (React 19 + Vite) provides the primary interface.')
          p.write_text(text)

          p = Path('.github/workflows/ci.yml')
          text = p.read_text().replace('  NEXT_PUBLIC_API_URL: "http://localhost:8080"\n', '')
          p.write_text(text)
          PY

      - name: Build TypeScript SDK
        run: |
          cd packages/sdk/typescript
          npm ci
          npm run build

      - name: Refresh web lockfile
        run: |
          cd apps/web
          npm install --package-lock-only --ignore-scripts
          npm ci

      - name: Verify frontend
        run: |
          cd apps/web
          npm run typecheck
          npm test
          npm run build

      - name: Format and verify Go cutover
        run: |
          gofmt -w apps/api/internal/webui apps/api/internal/server/unified.go apps/api/cmd/api/main.go
          cd apps/api
          go test ./internal/webui ./internal/server

      - name: Commit finalized migration state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(web): finalize Vite cutover and lockfile'
          git push origin HEAD:codex/vite-tanstack-go-embed
