name: Studio Biome Format Evidence

on:
  push:
    branches:
      - test/studio-ci-integration-20261017

permissions:
  contents: read

jobs:
  format-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build local SDK
        run: cd packages/sdk/typescript && npm ci && npm run build
      - name: Install web dependencies
        run: cd apps/web && npm ci
      - name: Generate reproducible Biome-formatted changed files
        shell: bash
        run: |
          set -eu
          cd apps/web
          npx biome check --write 'app/projects/[id]/brief-handoff/page.tsx' lib/brief-handoff.ts lib/brief-handoff.test.ts
          for path in 'app/projects/[id]/brief-handoff/page.tsx' lib/brief-handoff.ts lib/brief-handoff.test.ts; do
            echo "FORMATTED_FILE_BEGIN:${path}"
            base64 -w0 "$path"
            echo
            echo "FORMATTED_FILE_END:${path}"
          done
