version: "2"
sql:
  - engine: "postgresql"
    queries: "queries/"
    # sqlc accepts a list of schema paths; keep proof-bound goal DDL additive
    # while the legacy schema.sql remains the primary monolith.
    schema:
      - "schema.sql"
      - "schema_goals.sql"
    gen:
      go:
        package: "gen"
        out: "gen"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_db_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        emit_result_struct_pointers: false
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "jsonb"
            go_type: "github.com/sqlc-dev/pqtype.NullRawMessage"
            nullable: true
          - db_type: "timestamptz"
            go_type: "time.Time"
