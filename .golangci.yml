# golangci-lint v2.13.2 configuration. Keep explicit analyzer policy:
# gosimple and stylecheck are included in staticcheck on v2,
# typecheck is a built-in error, and gofmt is a separate formatter.
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

output:
  formats:
    text:
      path: stdout
      colors: true
      print-issued-lines: true
      print-linter-name: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - gocritic
    - misspell
    - revive

  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    misspell:
      locale: US
    revive:
      severity: warning
      rules:
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id

  exclusions:
    # v1 excluded files with a lax generated-file detector.
    generated: lax
    rules:
      - path: '_test\.go'
        linters:
          - errcheck
      - linters:
          - revive
        text: "exported: (type|method|function|const|var) .* should have comment or be unexported"
      - linters:
          - staticcheck
        text: "ST1000|ST1003|ST1016|ST1020|ST1021|ST1022|S1017"
      - linters:
          - gocritic
        text: "singleCaseSwitch|sloppyReassign|unnamedResult|unnecessaryBlock|whyNoLint|appendAssign|offBy1"
      # "cancelled" is a persistent public task state (not a prose typo).
      - path: 'apps/api/internal/handlers/tasks(_test)?\\.go'
        linters:
          - misspell
        text: "cancelled"

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
