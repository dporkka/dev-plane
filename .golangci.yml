run:
  timeout: 5m
  modules-download-mode: readonly

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - gocritic
    - gofmt
    - misspell
    - revive
    - typecheck

  disable:
    # Noisy or opinionated linters that are not appropriate for a first pass.
    - depguard
    - dupl
    - exhaustruct
    - forbidigo
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - gocyclo
    - godot
    - godox
    - err113
    - gofumpt
    - lll
    - nestif
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - paralleltest
    - prealloc
    - promlinter
    - rowserrcheck
    - sqlclosecheck
    - stylecheck
    - tagliatelle
    - testpackage
    - thelper
    - tparallel
    - unparam
    - varnamelen
    - wsl

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0

  exclude-rules:
    # Generated code is not maintained by hand.
    - path: '_test\.go'
      linters:
        - errcheck
        - gosec

    # Allow global variables in cmd/main entrypoints and generated code.
    - path: 'cmd/.*|.*\.gen\.go'
      linters:
        - gochecknoglobals

    # Revive: allow common exported identifiers without comments during initial rollout.
    - linters:
        - revive
      text: "exported: (type|method|function|const|var) .* should have comment or be unexported"

    # Staticcheck / gosimple: disable checks that typically require broad refactors.
    - linters:
        - staticcheck
        - gosimple
      text: "ST1000|ST1003|ST1016|ST1020|ST1021|ST1022|S1017"

    # Gocritic: disable checks that need careful code review for first pass.
    - linters:
        - gocritic
      text: "singleCaseSwitch|sloppyReassign|unnamedResult|unnecessaryBlock|whyNoLint|appendAssign|offBy1"

linters-settings:
  errcheck:
    check-type-assertions: false
    check-blank: false

  gofmt:
    # Simplify code during formatting. Disabled for the initial rollout to avoid
    # touching every `interface{}` site; enable later to enforce `any`.
    # rewrite-rules:
    #   - pattern: 'interface{}'
    #     replacement: 'any'

  govet:
    enable-all: true
    disable:
      - fieldalignment
      - shadow

  misspell:
    locale: US

  revive:
    ignore-generated-header: true
    severity: warning
    rules:
      # - name: blank-imports  # disabled: common for driver-side-effect imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      # - name: exported  # disabled: would require doc comments on many exported identifiers
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      # - name: package-comments  # disabled for initial rollout (would require comments in every module)
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      # - name: unused-parameter  # disabled: many handlers/callbacks have context params
      - name: unreachable-code
      - name: redefines-builtin-id
      # Disabled for initial rollout; would require package comments in every module.
      # - name: package-comments
