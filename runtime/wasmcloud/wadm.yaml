# wadm.yaml -- wasmCloud Application Deployment Manager manifest for the
# Multi-Agent Developer Mesh agent component lattice.
#
# This manifest defines:
#   - The agent microservice component (handles prompts, heartbeats, health)
#   - A mock Nulang compiler component used for local development and CI
#   - A NATS messaging provider for wRPC over the mesh
#   - A KV provider for lattice-wide state
#   - Links between components and capability providers
#   - Traits and policies for spread/scaling

apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: agent-mesh
  annotations:
    description: "Multi-Agent Developer Mesh agent lattice"
    version: "0.1.0"
spec:
  components:
    # -------------------------------------------------------------------------
    # Agent microservice component
    # -------------------------------------------------------------------------
    - name: agent-service
      type: component
      properties:
        image: ghcr.io/dev-plane/agent-service:0.1.0
      traits:
        - type: spreadscaler
          properties:
            instances: 3
            spread:
              - name: local
                weight: 40
                requirements:
                  node: local-workstation
              - name: remote
                weight: 60
                requirements:
                  node: remote-vps

    # -------------------------------------------------------------------------
    # Mock Nulang compiler component (development / CI only)
    # -------------------------------------------------------------------------
    - name: nulang-compiler
      type: component
      properties:
        image: ghcr.io/dev-plane/nulang-compiler-mock:0.1.0
      traits:
        - type: spreadscaler
          properties:
            instances: 1

    # -------------------------------------------------------------------------
    # NATS messaging capability provider (wRPC transport)
    # -------------------------------------------------------------------------
    - name: nats-messaging
      type: capability
      properties:
        image: wasmcloud.azurecr.io/nats-messaging:0.24.0
      traits:
        - type: spreadscaler
          properties:
            instances: 1

    # -------------------------------------------------------------------------
    # Key-value capability provider (lattice state)
    # -------------------------------------------------------------------------
    - name: kvredis
      type: capability
      properties:
        image: wasmcloud.azurecr.io/kvredis:0.26.0
      traits:
        - type: spreadscaler
          properties:
            instances: 1

    # -------------------------------------------------------------------------
    # HTTP server capability provider (health / management endpoints)
    # -------------------------------------------------------------------------
    - name: httpserver
      type: capability
      properties:
        image: wasmcloud.azurecr.io/httpserver:0.22.0
      traits:
        - type: spreadscaler
          properties:
            instances: 1

  policies:
    # Require that all remote copies run on nodes labeled secure=true.
    - name: secure-remote
      type: group-affinity
      properties:
        affinity:
          - component: agent-service
            spread: remote
            required: true
            node_labels:
              secure: "true"

  # ---------------------------------------------------------------------------
  # Links: describe which components use which capability providers.
  # ---------------------------------------------------------------------------
  links:
    # Agent service -> NATS messaging
    - name: agent-nats
      from:
        component: agent-service
        namespace: dev-plane
        package: agent
        interfaces: [messaging]
      to:
        component: nats-messaging
        namespace: dev-plane
        package: messaging
        interfaces: [consumer, publisher]
      properties:
        source_config:
          - name: agent-nats-config
            properties:
              subscriptions: agents.prompt.*.*.*,agents.hb.*.*.*
              publish_prefix: agents.telemetry

    # Agent service -> KV store
    - name: agent-kv
      from:
        component: agent-service
        namespace: dev-plane
        package: agent
        interfaces: [state]
      to:
        component: kvredis
        namespace: dev-plane
        package: keyvalue
        interfaces: [atomics, store]
      properties:
        target_config:
          - name: agent-kv-config
            properties:
              bucket: nodes.inventory

    # Agent service -> HTTP server (health endpoint)
    - name: agent-health
      from:
        component: httpserver
        namespace: dev-plane
        package: httpserver
        interfaces: [incoming-handler]
      to:
        component: agent-service
        namespace: dev-plane
        package: agent
        interfaces: [health]
      properties:
        target_config:
          - name: agent-health-config
            properties:
              address: 127.0.0.1:8080
              route: /health

    # Nulang compiler -> NATS messaging (request/reply compile jobs)
    - name: nulang-nats
      from:
        component: nulang-compiler
        namespace: dev-plane
        package: nulang
        interfaces: [compile]
      to:
        component: nats-messaging
        namespace: dev-plane
        package: messaging
        interfaces: [consumer, publisher]
      properties:
        source_config:
          - name: nulang-nats-config
            properties:
              subscriptions: agents.nulang.compile
              publish_prefix: agents.nulang
