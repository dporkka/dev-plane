services:
  benchmark:
    build:
      context: .
      dockerfile: tools/codeintel-benchmark/Dockerfile
      args:
        CODEBASE_MEMORY_VERSION: "0.11.0"
        GITNEXUS_VERSION: "1.6.12"
    working_dir: /workspace/dev-plane
    environment:
      CI: "1"
      CODEINTEL_RUN_LIVE: "1"
      CODEINTEL_REPOS_ROOT: /repos
      HOME: /var/lib/codeintel
      CBM_CACHE_DIR: /var/lib/codeintel/cbm
      GITNEXUS_STORAGE_ROOT: /var/lib/codeintel/gitnexus
      GITNEXUS_NO_UPDATE_NOTIFIER: "1"
      GITNEXUS_SKIP_OPTIONAL_GRAMMARS: "1"
      CODEINTEL_CODEBASE_MEMORY_CMD: "codebase-memory-mcp"
      CODEINTEL_CODEBASE_MEMORY_VERSION_CMD: "codebase-memory-mcp --version"
      CODEINTEL_GITNEXUS_MCP_CMD: "gitnexus mcp"
      CODEINTEL_GITNEXUS_ANALYZE_CMD: "gitnexus analyze --index-only"
      CODEINTEL_GITNEXUS_VERSION_CMD: "gitnexus --version"
    volumes:
      - .:/workspace/dev-plane:ro
      - ${CODEINTEL_REPOS_ROOT:?set CODEINTEL_REPOS_ROOT to the directory containing adacavo, nulang, nulang-cloud, and dev-plane clones}:/repos:ro
      - ./data/codeintel-bakeoff:/workspace/dev-plane/data/codeintel-bakeoff
      - codeintel-benchmark-cache:/var/lib/codeintel
    command: ["bash", "scripts/verify-codeintel.sh"]

volumes:
  codeintel-benchmark-cache:
    driver: local
